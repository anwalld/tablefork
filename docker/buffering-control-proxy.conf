events {}
http {
    resolver 127.0.0.11 valid=1s ipv6=off;
    server {
        listen 8000;
        set $backend app-2:8000;
        location /internal/buffer/ {
            if (-f /control/blocked) { return 503; }
            proxy_pass http://$backend;
        }
        location / { proxy_pass http://$backend; }
    }
}
