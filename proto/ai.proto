// Between the C++ chat server (client) and the Python AI service (server).
syntax = "proto3";

package chat.ai;

service AiGateway {
  // One long-lived stream per chat server instance. The chat server reports
  // what happens in rooms; the AI service answers with what the AIs say.
  rpc Connect(stream GatewayEvent) returns (stream AiAction);

  // Validates a user's model API key with its provider, then stores it
  // encrypted. Only the AI service ever sees the key in the clear.
  rpc StoreKey(StoreKeyRequest) returns (StoreKeyReply);
}

message Human {
  int64 member_id = 1;
  int64 user_id = 2;
  string name = 3;
}

message AiMember {
  int64 member_id = 1;
  string slug = 2;
  string provider = 3;
  string name = 4;
  string model_slug = 5;
  string admission_id = 6;
  string persona = 7;
  uint64 persona_version = 8;
  string creator_name = 9;
  bool is_legacy = 10;
}

// Who is in a room at the time of the event.
message RoomSnapshot {
  int64 room_id = 1;
  repeated Human humans = 2;
  repeated AiMember ais = 3;
  bool collaboration_enabled = 4;
  string room_name = 5;
  // A breakout inherits its parent's history only up to fork_seq.
  int64 parent_room_id = 6;
  int64 fork_seq = 7;
}

message Sender {
  int64 member_id = 1;
  bool is_ai = 2;
  int64 user_id = 3;  // humans only
  string slug = 4;    // AIs only
  string name = 5;
}

message MessageSaved {
  RoomSnapshot room = 1;
  int64 seq = 2;
  Sender sender = 3;
  string content = 4;
  string generation_id = 5;  // AI messages only
  int64 created_at_ms = 6;
  bool stopped = 7;
  string client_msg_id = 8;
  repeated int64 mention_ids = 9;
  string generation_outcome = 10;
}

message MembersChanged {
  RoomSnapshot room = 1;
}

message RoomDeleted {
  int64 room_id = 1;
}

message GatewayEvent {
  // Unique together: instance_id is random per chat server process, event_id
  // counts up within it. Resent events keep both, so they can be ignored.
  string instance_id = 1;
  int64 event_id = 2;
  oneof body {
    MessageSaved message_saved = 3;
    MembersChanged members_changed = 4;
    RoomDeleted room_deleted = 5;
    GenerationRejected generation_rejected = 6;
    ControlChanged control_changed = 7;
    ConfirmationInput confirmation_input = 8;
    CouncilStart council_start = 9;
    CouncilOverride council_override = 10;
  }
}

// A human responded to a confirmation request. `response` is "continue"
// (the step runs), "cancel" (the step is abandoned), or "other" (an ordinary
// message that only cancels the countdown). The C++ server checks who may
// confirm, so the AI service can trust it.
message ConfirmationInput {
  int64 room_id = 1;
  string response = 2;
  int64 member_id = 3;   // who responded
  bool privileged = 4;   // owner or admin, checked by the chat server
}

// A human sent "/表决 <topic>"; the chat server parsed it and checked that
// the room has enough chairs.
message CouncilStart {
  int64 room_id = 1;
  string topic = 2;
  int64 proposer_member_id = 3;
}

// A privileged human sent "/否决" or "/强制通过".
message CouncilOverride {
  int64 room_id = 1;
  string verdict = 2;  // "veto" | "force_pass"
  int64 member_id = 3;
}

message ControlChanged {
  int64 room_id = 1;
  uint64 revision = 2;
}

message GenerationRejected {
  int64 room_id = 1;
  string generation_id = 2;
}

message Ack {
  int64 event_id = 1;
}

// Part of a reply being generated. Not stored.
message Chunk {
  int64 room_id = 1;
  string generation_id = 2;
  int64 ai_member_id = 3;
  string text = 4;
  uint32 attempt = 5;
  uint32 sequence = 6;
  bool cumulative = 7;
  string snapshot = 8;
  string admission_id = 9;
}

// A finished reply, to be stored and delivered as an ordinary message.
message Final {
  int64 room_id = 1;
  string generation_id = 2;
  int64 ai_member_id = 3;
  string content = 4;
  string admission_id = 5;
  uint32 attempt = 6;
}

// A generation that will not finish. The room drops its partial text; only
// notify_member_id is told why.
message Failed {
  int64 room_id = 1;
  string generation_id = 2;
  int64 ai_member_id = 3;
  int64 notify_member_id = 4;
  string code = 5;
  string message = 6;
  string admission_id = 7;
}

// A message for one user only, such as a missing API key.
message Notice {
  int64 room_id = 1;
  int64 notify_member_id = 2;
  string code = 3;
  string provider = 4;
  string message = 5;
}

message AiAction {
  oneof body {
    Ack ack = 1;
    Chunk chunk = 2;
    Final final = 3;
    Failed failed = 4;
    Notice notice = 5;
    SystemNotice system_notice = 6;
  }
}

// A message the AI service asks the chat server to show the whole room, such
// as a confirmation request ("still there?"). The chat server stores it and
// pushes it like an ordinary message.
message SystemNotice {
  int64 room_id = 1;
  string content = 2;
}

message StoreKeyRequest {
  int64 user_id = 1;
  string provider = 2;
  string api_key = 3;
}

message StoreKeyReply {
  bool ok = 1;
  string last4 = 2;
  string error_code = 3;  // api_key_invalid, invalid_argument, unavailable
}
