# Tools the AIs may call in collaboration rooms (AI_TOOLS_ENABLED=1).
# Nothing outside this file can be called. Each tool is "readonly" (runs at
# once and is recorded in the reply) or "side_effect" (runs only after the
# initiator or an owner/admin replies "继续"; never on a timeout, never retried).

[[builtin]]
name = "current_time"
risk = "readonly"

[[builtin]]
name = "search_messages"
risk = "readonly"

[[builtin]]
name = "search_knowledge"
risk = "readonly"

