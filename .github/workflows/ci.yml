name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CI be rerun by hand from the Actions tab or `gh workflow run CI`.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with throwaway passwords
        run: |
          cp .env.example .env
          for name in MYSQL_ROOT_PASSWORD MYSQL_PASSWORD REDIS_PASSWORD; do
            sed -i "s/^$name=.*/$name=$(openssl rand -hex 24)/" .env
          done

      - name: Run unit, web and integration tests
        run: scripts/test.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
